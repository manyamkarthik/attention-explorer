[project]
name = "attention-explorer"
version = "0.1.0"
description = "Chapter 3 of 'Build a Large Language Model (From Scratch)' as running code: self-attention, causal masking, multi-head attention, and live heatmaps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "tiktoken>=0.7",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "matplotlib",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_explorer"]
